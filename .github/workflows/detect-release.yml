name: Detect IB API Release

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

jobs:
  update-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      channel: ${{ steps.version.outputs.channel }}
      has_update: ${{ steps.check-update.outputs.has_update }}
    steps:
      - uses: actions/checkout@v5.0.0
  
      - name: Get Latest Version
        id: version
        run: |
          channel="$(echo "${{ inputs.channel }}" | tr '[:upper:]' '[:lower:]')"
          response=$(curl -sSfL https://download2.interactivebrokers.com/installers/tws-api/index.html)
          api_version=$(echo "$response" | tr -d '\n' | grep -oP '<span>${{ inputs.channel }}</span>.*?Version:\s*<strong>\K[0-9]+\.[0-9]+' | head -1)
          if [ -z "$api_version" ]; then
            echo "::error::Could not find ${{ inputs.channel }} version on the TWS API download page"
            exit 1
          fi
          build_version=$(echo "$api_version" | sed 's/^\([0-9][0-9]\)\(.*\)$/\1.\2/')
          file_name="tws-api-$channel-linux-x64.sh"
          echo "file_url=https://download2.interactivebrokers.com/installers/tws-api/$channel/$file_name" >> $GITHUB_OUTPUT
          echo "file_name=$file_name" >> $GITHUB_OUTPUT
          echo "api_version=$api_version" >> $GITHUB_OUTPUT
          echo "build_version=$build_version" >> $GITHUB_OUTPUT
          echo "channel=$channel" >> $GITHUB_OUTPUT
  
      - name: Check if there is an update
        id: check-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.build_version }}"
  
          # Check if release already exists
          if gh release view "ibapi-${{ steps.version.outputs.channel }}@$version" > /dev/null 2>&1; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
  
          # Check if code already updated in pyproject.toml (PR merged but release failed)
          if grep -q "version = \"$version\"" pyproject.toml; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
  
          echo "has_update=true" >> $GITHUB_OUTPUT
  
      - name: Download
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        run: |
          curl -sSL "${{ steps.version.outputs.file_url }}" --output "/tmp/${{ steps.version.outputs.file_name }}"
  
      - name: Extract and Move
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        run: |
          sh "/tmp/${{ steps.version.outputs.file_name }}" -q -dir /tmp/IBJts
          grep -qx "API_Version=${{ steps.version.outputs.api_version }}" /tmp/IBJts/API_VersionNum.txt
          rsync -a /tmp/IBJts/source/pythonclient/ ./
          sed -i 's/version = "[^"]*"/version = "'"${{ steps.version.outputs.build_version }}"'"/' pyproject.toml
  
      - name: Create or Update PR
        id: create-pr
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          t_branch="update-release-to-${{ steps.version.outputs.build_version }}"
  
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin
  
          # Reuse branch if it already exists
          if git ls-remote --exit-code origin "$t_branch"; then
            git checkout "$t_branch"
          else
            git checkout -b "$t_branch" origin/main
          fi
  
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update release to ${{ steps.version.outputs.channel }}-${{ steps.version.outputs.build_version }}"
            git push --set-upstream origin "$t_branch"
          fi
  
          # Reuse PR if it already exists
          pr_url=$(gh pr list --head "$t_branch" --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create --base main --fill --head "$t_branch")
          fi
  
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
  
      - name: Auto-merge PR
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pr_url }}" --squash --delete-branch --admin || \
          echo "PR already merged"

  create-release:
    runs-on: ubuntu-latest
    needs: update-branch
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set variables
        run: |
          BUILD_VERSION="${{ needs.update-branch.outputs.build_version }}"
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
  
      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="ibapi-${{ needs.update-branch.outputs.channel }}@$BUILD_VERSION"
  
          # Check if release already exists
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping creation."
            exit 0
          fi
  
          # Create the release
          gh release create "$TAG" \
            -t "IB API ${{ needs.update-branch.outputs.channel }} $BUILD_VERSION" \
            -n "IB API ${{ needs.update-branch.outputs.channel }} $BUILD_VERSION release files"
